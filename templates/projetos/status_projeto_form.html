{% extends 'base.html' %}

{% block title %}Editar Estado do Projeto{% endblock %}

{% block content %}
<div class="container-fluid" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3><i class="bi bi-flag-fill text-info me-1"></i> Editar Estado: {{ estado.nome }}</h3>
        <a href="{% url 'gerenciamento_status' %}" class="btn btn-outline-secondary">Voltar</a>
    </div>

    <div class="card card-custom p-4">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Nome do Estado</label>
                {{ form.nome }}
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Cor da Etiqueta</label>
                {{ form.cor }}
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Ordem de Exibição</label>
                {{ form.ordem }}
            </div>
            <div class="form-check form-switch mb-3">
                {{ form.eh_concluido }}
                <label class="form-check-label fw-semibold" for="{{ form.eh_concluido.id_for_label }}">
                    Representa Projeto Concluído?
                </label>
            </div>
            <div class="form-check form-switch mb-4">
                {{ form.ativo }}
                <label class="form-check-label fw-semibold" for="{{ form.ativo.id_for_label }}">Ativo</label>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'gerenciamento_status' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-success">Salvar Alterações</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
