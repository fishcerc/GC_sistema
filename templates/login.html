<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema - Gestão de Projetos Elétricos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background-color: #ffffff;
            border: none;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }
        .login-header {
            background-color: #1e293b;
            color: #ffffff;
            padding: 28px 24px;
            text-align: center;
            border-bottom: 3px solid #ffc107;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="mb-2">
                <i class="bi bi-lightning-charge-fill text-warning fs-1"></i>
            </div>
            <h4 class="fw-bold mb-1">Projetos Elétricos</h4>
            <p class="text-secondary small mb-0 text-light opacity-75">Sistema Operacional de Engenharia e OS</p>
        </div>

        <div class="p-4 p-md-4">
            {% if form.errors %}
                <div class="alert alert-danger py-2 small" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i>
                    Usuário ou senha incorretos. Tente novamente.
                </div>
            {% endif %}

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} py-2 small" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div class="mb-3">
                    <label for="id_username" class="form-label fw-semibold text-dark">Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person text-secondary"></i></span>
                        <input type="text" name="username" id="id_username" class="form-control" placeholder="Digite seu usuário" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="id_password" class="form-label fw-semibold text-dark">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock text-secondary"></i></span>
                        <input type="password" name="password" id="id_password" class="form-control" placeholder="Digite sua senha" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Entrar no Sistema
                </button>
            </form>
        </div>

        <div class="bg-light text-center py-3 border-top">
            <small class="text-muted">Gestão de Projetos Elétricos &bull; v1.0</small>
        </div>
    </div>

</body>
</html>
