<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema - Gestão de Projetos Elétricos</title>

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Tailwind CSS Padrão -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script>
        // Carrega a preferência de tema salva antes de renderizar a página
        (function() {
            const temaSalvo = localStorage.getItem('tema_sistema') || 'light';
            if (temaSalvo === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200">

    <!-- Botão de Alternar Tema Claro / Escuro no Topo -->
    <div class="fixed top-5 right-5">
        <button type="button" id="btn-toggle-tema"
                class="flex items-center gap-2 px-4 py-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-sm font-medium shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition">
            <i id="icone-tema" class="bi bi-moon-stars-fill text-slate-600 dark:text-amber-400"></i>
            <span id="texto-tema">Tema Escuro</span>
        </button>
    </div>

    <!-- Card de Login Tailwind Padrão -->
    <div class="w-full max-w-md bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-lg overflow-hidden transition-colors duration-200">
        <!-- Cabeçalho -->
        <div class="bg-slate-800 dark:bg-slate-950 px-6 py-7 text-center border-b-4 border-amber-400">
            <div class="mb-2">
                <i class="bi bi-lightning-charge-fill text-amber-400 text-4xl"></i>
            </div>
            <h1 class="text-xl font-bold text-white">Projetos Elétricos</h1>
            <p class="text-xs text-slate-300 mt-1">Sistema Operacional de Engenharia e OS</p>
        </div>

        <!-- Formulário -->
        <div class="p-6 sm:p-8">
            {% if form.errors %}
                <div class="mb-4 px-4 py-3 rounded-lg bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-sm flex items-center gap-2">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span>Usuário ou senha incorretos. Tente novamente.</span>
                </div>
            {% endif %}

            {% if messages %}
                {% for message in messages %}
                    <div class="mb-4 px-4 py-3 rounded-lg bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 text-blue-700 dark:text-blue-300 text-sm">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'login' %}" class="space-y-4">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div>
                    <label for="id_username" class="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1.5">Usuário</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" name="username" id="id_username"
                               class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm transition"
                               placeholder="Digite seu usuário" required autofocus>
                    </div>
                </div>

                <div>
                    <label for="id_password" class="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1.5">Senha</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" name="password" id="id_password"
                               class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm transition"
                               placeholder="Digite sua senha" required>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                            class="w-full py-2.5 px-4 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm shadow-sm transition flex items-center justify-center gap-2">
                        <i class="bi bi-box-arrow-in-right"></i>
                        <span>Entrar no Sistema</span>
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-slate-50 dark:bg-slate-900/60 px-6 py-3 border-t border-slate-200 dark:border-slate-700 text-center">
            <small class="text-xs text-slate-500 dark:text-slate-400">Gestão de Projetos Elétricos &bull; v1.0</small>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const btnTema = document.getElementById('btn-toggle-tema');
            const iconeTema = document.getElementById('icone-tema');
            const textoTema = document.getElementById('texto-tema');

            function atualizarBotaoTema() {
                const ehEscuro = document.documentElement.classList.contains('dark');
                if (ehEscuro) {
                    iconeTema.className = 'bi bi-sun-fill text-amber-400';
                    textoTema.textContent = 'Tema Claro';
                } else {
                    iconeTema.className = 'bi bi-moon-stars-fill text-slate-600';
                    textoTema.textContent = 'Tema Escuro';
                }
            }

            atualizarBotaoTema();

            btnTema.addEventListener('click', function() {
                document.documentElement.classList.toggle('dark');
                const ehEscuro = document.documentElement.classList.contains('dark');
                localStorage.setItem('tema_sistema', ehEscuro ? 'dark' : 'light');
                atualizarBotaoTema();
            });
        });
    </script>
</body>
</html>
